agent:
  home: ~/.dataengineer
  target: deepseek
  providers:
    custom:
      api_key: ${WLB_API_KEY}
      base_url: https://codex.wlbclub.com/v1
    openai:
      api_key: ${OPENAI_API_KEY}
    deepseek:
      api_key: ${DEEPSEEK_API_KEY}
  services:
    datasources:
      demo:
        type: duckdb
        uri: duckdb:///sample_data/duckdb-demo.duckdb
        read_only: true
      benchmark_demo:
        type: duckdb
        uri: duckdb:///sample_data/mf-demo.duckdb
        read_only: true
  workflow:
    plan: planA
    planA:
      - schema_linking
      - generate_sql
      - output
